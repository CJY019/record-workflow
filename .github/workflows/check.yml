name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public source
        run: python scripts/check_public_source.py
      - name: Check Python syntax
        run: python -m compileall -q app cli.py launcher.py scripts
