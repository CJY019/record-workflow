name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public source
        run: python scripts/check_public_source.py
      - name: Check Python syntax
        run: python -m compileall -q app cli.py launcher.py scripts tests

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install offline test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Test queues, fallback and credentials
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test concurrent uploads
        run: node scripts/check_upload_ui.mjs
      - name: Test formulas and conversation menus
        run: node scripts/check_math_ui.mjs
